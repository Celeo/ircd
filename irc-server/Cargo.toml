[package]
name = "irc-server"
version = "0.1.0"
edition = "2021"
authors = ["Celeo <mattboulanger@fastmail.com>"]
description = ""
readme = "README.md"
homepage = "https://github.com/celeo/ircd"
repository = "https://github.com/celeo/ircd"
documentation = ""
license = "MIT OR Apache-2.0"
exclude = [".github"]
keywords = []
categories = []

[dependencies]
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
dashmap = "6.2.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
pretty_assertions = "1.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"

